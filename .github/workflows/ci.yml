# The gate on a CHANGE, as distinct from pages.yml's gate on a DEPLOY.
#
# These checks are deliberately not steps in pages.yml. That workflow fires only
# on a push to main, behind a path filter -- so a pull request, and any push to
# a branch, currently runs nothing at all. Its concurrency group is also `pages`
# with cancel-in-progress: false, which is right for a deploy that must never be
# interrupted half-finished and wrong for a lint that should be superseded the
# moment the branch moves again. Two workflows, two jobs, two reasons.
#
# pages.yml keeps its own `cargo test` step. That is not duplication: it gates
# the artifact that is about to be published, and it must keep doing so even if
# this file is ever disabled or its trigger narrowed.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# The opposite of pages.yml's setting, for the opposite reason: nothing here
# publishes anything, so an in-flight run on a stale commit is pure cost.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that runs on the host, which is everything except the browser
  # suite. Split from `browser` below so the fast feedback is not queued behind
  # a wasm toolchain download.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The SAME pin pages.yml uses, and it has to stay that way. Both rustfmt's
      # output and clippy's lint set move between releases, so two workflows
      # disagreeing about the toolchain is a way to land a commit that is green
      # here and red on the deploy -- or, worse, green on both until the day the
      # runner image's default toolchain rolls forward under you.
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy

      # Formatting first, because it is the only gate that needs no build at
      # all. A misformatted branch fails in seconds instead of after clippy has
      # compiled the yew dependency tree.
      - name: Format
        run: cargo fmt --all --check

      # --all-targets so the tests are linted too. They are the larger half of
      # what a stale assertion can hide in, and the half no other gate reads.
      #
      # --locked so a Cargo.lock that has drifted from Cargo.toml is a failure
      # in this job rather than a surprise in the deploy, where it would be
      # discovered by a release build.
      #
      # NOTE: this does NOT lint honeycomb-yew/tests/*.rs. Those files are
      # `#![cfg(target_arch = "wasm32")]`, so on the host they compile to an
      # empty module and clippy has nothing to look at. The `browser` job below
      # lints them against the target they are actually written for.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The suite that already gates the deploy, run here as well so it gates
      # the pull request that proposes the change -- which today it does not.
      #
      # Also host-only, and for the same reason: the browser tests build to
      # empty binaries here and report zero tests. They run in `browser`.
      - name: Test
        run: cargo test --workspace --locked

  # The nine defects that shipped, and the one Debug leak that reached a screen
  # reader, are all pinned by tests that only exist under
  # wasm32-unknown-unknown. If this job does not run, `cargo test --workspace`
  # compiles every one of them to an empty binary that passes with zero tests --
  # which is exactly the state the repository was in when an audit found nine
  # historical fixes with nothing pinning any of them.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      # The runner named in .cargo/config.toml. Its version must match the
      # wasm-bindgen in Cargo.lock -- a mismatch fails with a schema-version
      # error rather than silently doing the wrong thing, so pinning both and
      # bumping them together is the whole discipline here.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.128

      # What the host clippy run structurally cannot see: with the real target
      # selected, the `#![cfg(target_arch = "wasm32")]` test files are no longer
      # empty modules.
      - name: Clippy (wasm32)
        run: cargo clippy -p honeycomb-yew --target wasm32-unknown-unknown --features csr --all-targets --locked -- -D warnings

      # wasm-bindgen-test-runner drives a real browser over WebDriver. The
      # ubuntu-latest image ships Chrome and chromedriver and points
      # CHROMEWEBDRIVER at the directory holding the latter; the fallback keeps
      # this working on a runner that only has it on PATH.
      #
      # `--test '*'` and NOT a list of names, which this job learned the hard
      # way. The first version of this step named dom, keyboard and pointer
      # individually, because a bare `cargo test -p honeycomb-yew --target
      # wasm32-unknown-unknown` also picks up the --lib target, whose #[test]
      # functions are plain native tests with no wasm_bindgen_test_configure!,
      # and the run dies on `Exec format error` before a browser is started.
      # links.rs was then committed, passed locally, and ran in CI exactly zero
      # times -- nobody noticed until a later change happened to look. That is
      # the same "a list somebody has to remember to extend" failure this
      # repository has now been bitten by five times, and precisely the one
      # this job's own header is about.
      #
      # The glob selects every integration test and still excludes --lib, so a
      # new file in tests/ is covered the moment it exists. Verified: it runs
      # all five and does not reintroduce the Exec format error.
      - name: Browser tests
        run: |
          set -euo pipefail
          if [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "${CHROMEWEBDRIVER}/chromedriver" ]; then
            export CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver"
          else
            export CHROMEDRIVER="$(command -v chromedriver)"
          fi
          echo "chromedriver: ${CHROMEDRIVER}"
          cargo test -p honeycomb-yew --target wasm32-unknown-unknown --features csr --locked --test '*'
